---
- name: Simple n8n Server Setup
  hosts: n8n_server
  become: yes
  vars:
    user_home: "/home/{{ ansible_user }}"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Docker
      apt:
        name:
          - docker.io
          - docker-compose
        state: present

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Create n8n directory
      file:
        path: "{{ user_home }}/n8n"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Create docker-compose.yml for n8n
      copy:
        content: |
          version: '3'

          services:
            n8n:
              image: n8nio/n8n
              container_name: n8n
              restart: always
              ports:
                - "0.0.0.0:5678:5678"
              environment:
                - N8N_HOST=0.0.0.0
                - N8N_PORT=5678
                - N8N_PROTOCOL=http
                - NODE_ENV=production
                - GENERIC_TIMEZONE=Asia/Seoul
              volumes:
                - ./n8n_data:/home/node/.n8n
        dest: "{{ user_home }}/n8n/docker-compose.yml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"

    - name: Start n8n container
      community.docker.docker_compose_v2:
        project_src: "{{ user_home }}/n8n"
        state: present
      become_user: "{{ ansible_user }}"

    - name: Wait for n8n to start
      wait_for:
        port: 5678
        host: "{{ ansible_default_ipv4.address }}"
        delay: 10
        timeout: 60
