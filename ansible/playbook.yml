---
- name: Configure n8n Server
  hosts: n8n_server
  become: yes
  vars:
    domain_name: "{{ lookup('env', 'DOMAIN_NAME') }}"
    user_home: "/home/{{ ansible_user }}"

  tasks:
    - name: Update apt cache and install base packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-pip
        state: present
        update_cache: yes

    - name: Create directory for Docker GPG key
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker's official GPG key
      get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.gpg
        mode: '0644'
        force: true

    - name: Set up Docker repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine and Docker Compose
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Create and enable 1GB swap file
      block:
        - name: Create swap file
          command: fallocate -l 1G /swapfile
          args:
            creates: /swapfile
        - name: Set permissions for swap file
          file:
            path: /swapfile
            mode: '0600'
        - name: Make swap
          command: mkswap /swapfile
          args:
            warn: false
        - name: Turn on swap
          command: swapon /swapfile
          args:
            warn: false
        - name: Add swap to fstab
          lineinfile:
            path: /etc/fstab
            line: "/swapfile none swap sw 0 0"
            state: present
      when: ansible_memory_mb['real']['total'] < 2048

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Create docker-compose directory
      file:
        path: "{{ user_home }}/n8n"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Template docker-compose.yml for n8n
      template:
        src: templates/docker-compose.yml.j2
        dest: "{{ user_home }}/n8n/docker-compose.yml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'
      vars:
        domain_name: "{{ domain_name }}"

    - name: Template Nginx configuration
      template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/sites-available/n8n
      notify: Reload Nginx

    - name: Enable Nginx site
      file:
        src: /etc/nginx/sites-available/n8n
        dest: /etc/nginx/sites-enabled/n8n
        state: link
      notify: Reload Nginx

    - name: Remove default Nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload Nginx

    - name: Install Certbot and its Nginx plugin
      apt:
        name:
          - certbot
          - python3-certbot-nginx
        state: present

    - name: Obtain Let's Encrypt SSL certificate
      command: "certbot --nginx --non-interactive --agree-tos --email admin@{{ domain_name }} -d {{ domain_name }}"
      args:
        creates: /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem

    - name: Start n8n container
      community.docker.docker_compose_v2:
        project_src: "{{ user_home }}/n8n"
        state: present

  handlers:
    - name: Reload Nginx
      service:
        name: nginx
        state: reloaded