name: Deploy n8n Infrastructure

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

# Re-triggering workflow to fix previous error

jobs:
  terraform-deploy:
    name: "Terraform: Deploy Infrastructure"
    runs-on: ubuntu-latest
    outputs:
      instance_ip: ${{ steps.get_ip.outputs.IP }}
    env:
      TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.1.9

      - name: Terraform Init
        id: init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Validate
        id: validate
        run: terraform validate
        working-directory: ./terraform

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color
        working-directory: ./terraform
        continue-on-error: true

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve -no-color
        working-directory: ./terraform

      - name: Get Instance IP
        id: get_ip
        run: |
          IP=$(terraform output -raw instance_ip)
          echo "IP=${IP}" >> $GITHUB_OUTPUT
        working-directory: ./terraform

      - name: Create Ansible Inventory
        run: |
          echo "[n8n_server]" > inventory
          echo "${{ steps.get_ip.outputs.IP }} ansible_user=admin" >> inventory

      - name: Upload Inventory as Artifact
        uses: actions/upload-artifact@v3
        with:
          name: inventory
          path: inventory
          retention-days: 1

  ansible-configure:
    name: "Ansible: Configure Server"
    runs-on: ubuntu-latest
    needs: terraform-deploy
    env:
      DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download Inventory Artifact
        uses: actions/download-artifact@v3
        with:
          name: inventory
          path: ./ansible

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Wait for SSH to be available
        uses: lewagon/wait-on-ssh-action@v1.0.0
        with:
          host: ${{ needs.terraform-deploy.outputs.instance_ip }}
          port: 22
          username: admin
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 120 # seconds

      - name: Install Ansible and dependencies
        run: |
          python3 -m pip install --user ansible ansible-lint
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Lint Ansible Playbook
        run: ansible-lint playbook.yml
        working-directory: ./ansible

      - name: Install Ansible collections
        run: ansible-galaxy install -r requirements.yml
        working-directory: ./ansible

      - name: Run Ansible Playbook
        run: ansible-playbook playbook.yml
        working-directory: ./ansible