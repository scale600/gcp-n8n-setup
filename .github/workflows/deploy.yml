name: Deploy n8n to GCP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  terraform-deploy:
    name: Deploy Infrastructure with Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Terraform Init
        run: |
          cd terraform
          terraform init

      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan -var="gcp_project_id=${{ secrets.GCP_PROJECT_ID }}" -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}"

      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply -auto-approve -var="gcp_project_id=${{ secrets.GCP_PROJECT_ID }}" -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}"

    - name: Get Instance IP
      id: get-ip
      run: |
        cd terraform
        INSTANCE_IP=$(terraform output -raw instance_ip)
        echo "ip=$INSTANCE_IP" >> $GITHUB_OUTPUT
        echo "Instance IP: $INSTANCE_IP"

      - name: Upload IP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: instance-ip
          path: |
            terraform/terraform.tfstate
          retention-days: 1

      - name: Output IP Address
        run: |
          echo "Instance IP: ${{ steps.get-ip.outputs.ip }}"
          echo "Please update your DNS A record to point to this IP address"

  ansible-configure:
    name: Configure Server with Ansible
    runs-on: ubuntu-latest
    needs: terraform-deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download IP artifact
        uses: actions/download-artifact@v4
        with:
          name: instance-ip
          path: terraform/

      - name: Setup Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Create SSH key file
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ needs.terraform-deploy.outputs.ip }} >> ~/.ssh/known_hosts

      - name: Create Ansible inventory
        run: |
          cd ansible
          echo "[n8n_server]" > inventory.ini
          echo "${{ needs.terraform-deploy.outputs.ip }} ansible_user=admin ansible_ssh_private_key_file=~/.ssh/id_rsa" >> inventory.ini

      - name: Run Ansible playbook
        run: |
          cd ansible
          ansible-playbook -i inventory.ini playbook.yml -e "DOMAIN_NAME=${{ secrets.DOMAIN_NAME }}"
        env:
          ANSIBLE_HOST_KEY_CHECKING: False

      - name: Cleanup
        run: |
          rm -f ~/.ssh/id_rsa
          rm -f ansible/inventory.ini

  notify-completion:
    name: Notify Deployment Completion
    runs-on: ubuntu-latest
    needs: [terraform-deploy, ansible-configure]
    if: always()

    steps:
      - name: Deployment Status
        run: |
          if [ "${{ needs.terraform-deploy.result }}" == "success" ] && [ "${{ needs.ansible-configure.result }}" == "success" ]; then
            echo "✅ Deployment completed successfully!"
            echo "🌐 Your n8n instance should be available at: https://${{ secrets.DOMAIN_NAME }}"
          else
            echo "❌ Deployment failed. Please check the logs above."
            exit 1
          fi
