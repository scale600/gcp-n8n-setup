name: Deploy n8n to GCP

on:
  push:
    branches: [main, master, feat/n8n-cicd-pipeline]
  workflow_dispatch:

jobs:
  terraform-deploy:
    name: Deploy Infrastructure with Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Terraform Init
        run: |
          cd terraform
          terraform init

      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan -var="gcp_project_id=${{ secrets.GCP_PROJECT_ID }}" -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}"

    - name: Cleanup existing resources
      run: |
        # Delete existing resources to avoid conflicts
        echo "Cleaning up existing GCP resources..."
        gcloud compute instances delete n8n-server --zone=us-central1-a --project=${{ secrets.GCP_PROJECT_ID }} --quiet || echo "Instance not found"
        gcloud compute addresses delete n8n-static-ip --region=us-central1 --project=${{ secrets.GCP_PROJECT_ID }} --quiet || echo "Static IP not found"
        gcloud compute firewall-rules delete allow-http --project=${{ secrets.GCP_PROJECT_ID }} --quiet || echo "HTTP firewall rule not found"
        gcloud compute firewall-rules delete allow-https --project=${{ secrets.GCP_PROJECT_ID }} --quiet || echo "HTTPS firewall rule not found"
        gcloud compute firewall-rules delete allow-ssh --project=${{ secrets.GCP_PROJECT_ID }} --quiet || echo "SSH firewall rule not found"
        echo "Cleanup completed"

    - name: Terraform Apply
      run: |
        cd terraform
        terraform apply -auto-approve -var="gcp_project_id=${{ secrets.GCP_PROJECT_ID }}" -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}"

    - name: Get Instance IP
      id: get-ip
      run: |
        cd terraform
        INSTANCE_IP=$(terraform output -raw instance_ip)
        echo "ip=$INSTANCE_IP" >> $GITHUB_OUTPUT
        echo "Instance IP: $INSTANCE_IP"
        echo "IP_ADDRESS=$INSTANCE_IP" >> $GITHUB_ENV

      - name: Upload IP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: instance-ip
          path: |
            terraform/terraform.tfstate
          retention-days: 1

      - name: Output IP Address
        run: |
          echo "Instance IP: ${{ steps.get-ip.outputs.ip }}"
          echo "Please update your DNS A record to point to this IP address"

  ansible-configure:
    name: Configure Server with Ansible
    runs-on: ubuntu-latest
    needs: terraform-deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download IP artifact
        uses: actions/download-artifact@v4
        with:
          name: instance-ip
          path: terraform/

      - name: Setup Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

    - name: Create SSH key file
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H 34.41.206.205 >> ~/.ssh/known_hosts

    - name: Create Ansible inventory
      run: |
        cd ansible
        echo "[n8n_server]" > inventory.ini
        echo "34.41.206.205 ansible_user=admin ansible_ssh_private_key_file=~/.ssh/id_rsa" >> inventory.ini

      - name: Run Ansible playbook
        run: |
          cd ansible
          ansible-playbook -i inventory.ini playbook.yml -e "DOMAIN_NAME=${{ secrets.DOMAIN_NAME }}"
        env:
          ANSIBLE_HOST_KEY_CHECKING: False

      - name: Cleanup
        run: |
          rm -f ~/.ssh/id_rsa
          rm -f ansible/inventory.ini

  notify-completion:
    name: Notify Deployment Completion
    runs-on: ubuntu-latest
    needs: [terraform-deploy, ansible-configure]
    if: always()

    steps:
      - name: Deployment Status
        run: |
          if [ "${{ needs.terraform-deploy.result }}" == "success" ] && [ "${{ needs.ansible-configure.result }}" == "success" ]; then
            echo "✅ Deployment completed successfully!"
            echo "🌐 Your n8n instance should be available at: https://${{ secrets.DOMAIN_NAME }}"
          else
            echo "❌ Deployment failed. Please check the logs above."
            exit 1
          fi
