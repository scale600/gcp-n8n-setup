name: Daily Auto Commit

on:
  schedule:
    # 매일 UTC 00시 00분에 실행 (한국 시간으로 오전 9시)
    # cron 구문: 분 시 일 월 요일
    # 원하는 시간에 맞게 수정 가능 (예: '0 15 * * *' 는 UTC 15시, 한국 시간 자정)
    - cron: '0 0 * * *' 
  workflow_dispatch: # 수동 실행을 위한 버튼 추가

jobs:
  auto_commit:
    runs-on: ubuntu-latest
    steps:
      # 1. 저장소 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 커밋에 사용할 사용자 정보 설정
      - name: Configure Git
        run: |
          git config user.name "scale600" # 본인의 GitHub 사용자 이름으로 변경
          git config user.email "scale600@gmail.com" # 본인의 GitHub 계정에 연결된 이메일 주소로 변경

      # 3. 변경할 내용 생성 (README 파일에 현재 날짜 추가)
      - name: Create change
        run: |
          echo "$(date) - Automated daily contribution" >> README.md

      # 4. 변경사항 커밋 및 푸시
      - name: Commit and Push
        uses: EndBug/add-and-commit@v9
        with:
          message: 'chore(bot): Daily contribution update'
          # GITHUB_TOKEN을 사용하여 커밋 권한 부여
          # actions/checkout@v4와 함께 사용하려면 이 토큰이 필요합니다.
          github_token: ${{ secrets.GITHUB_TOKEN }}
